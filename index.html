<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CacauCrm</title>
    <link rel="stylesheet" href="./style.css?v=7">
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <h1>CacauCrm</h1>
        <div>
            <input type="text" id="busca" oninput="buscarLeads()" placeholder="🔍 Buscar cliente...">
        </div>
        <button onclick="abrirModal()" class="btn-principal">+ Novo Lead</button>
    </header>

    <!-- Quadro Kanban -->
    <main>
        <!-- Contato -->
        <div class="coluna-kanban">
            <h2 style="color: #fbbf24; font-size: 18px; font-weight: bold; margin-top: 0; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #334155;">📌 Contato Inicial</h2>
            <div id="col-contato" class="container-cards"></div>
        </div>

        <!-- Proposta -->
        <div class="coluna-kanban">
            <h2 style="color: #818cf8; font-size: 18px; font-weight: bold; margin-top: 0; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #334155;">📄 Proposta Enviada</h2>
            <div id="col-proposta" class="container-cards"></div>
        </div>

        <!-- Fechado -->
        <div class="coluna-kanban">
            <h2 style="color: #34d399; font-size: 18px; font-weight: bold; margin-top: 0; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #334155;">🎉 Contrato Fechado</h2>
            <div id="col-fechado" class="container-cards"></div>
        </div>
    </main>

    <!-- Formulário Modal Flutuante -->
    <div id="modal" style="display: none; position: fixed; inset: 0; z-index: 50; align-items: center; justify-content: center; padding: 16px;" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color: #818cf8; margin-top: 0; margin-bottom: 16px; font-size: 20px; font-weight: bold;">Cadastrar Novo Lead</h3>
            <input type="text" id="nome" placeholder="Nome do Cliente">
            <input type="text" id="valor" placeholder="Valor Estimado (R$)">
            <textarea id="notas" placeholder="Anotações" style="height: 80px; resize: none;"></textarea>
            
            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;">
                <button onclick="fecharModal()" style="background-color: #475569; color: white; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600;">Cancelar</button>
                <button onclick="salvarLead()" style="background-color: #4f46e5; color: white; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold;">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Puxa a versão mais recente do script -->
    <script src="./script.js?v=7"></script>
</body>
</html>
