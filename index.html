<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Profissional</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white font-sans">

    <!-- Cabeçalho -->
    <header class="p-5 bg-gray-800 border-b border-gray-700 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-indigo-400">Meu CRM Pro</h1>
        <button onclick="abrirModal()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-semibold transition">
            + Novo Lead
        </button>
    </header>

    <!-- Quadro Kanban -->
    <main class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Coluna: Contato -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
            <h2 class="text-lg font-semibold text-yellow-400 mb-4 border-b border-gray-700 pb-2">📌 Contato Inicial</h2>
            <div id="col-contato" class="space-y-4 min-h-[300px]" ondragover="permitirSoltar(event)" ondrop="soltar(event, 'contato')"></div>
        </div>

        <!-- Coluna: Proposta -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
            <h2 class="text-lg font-semibold text-indigo-400 mb-4 border-b border-gray-700 pb-2">📄 Proposta Enviada</h2>
            <div id="col-proposta" class="space-y-4 min-h-[300px]" ondragover="permitirSoltar(event)" ondrop="soltar(event, 'proposta')"></div>
        </div>

        <!-- Coluna: Fechado -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
            <h2 class="text-lg font-semibold text-green-400 mb-4 border-b border-gray-700 pb-2">🎉 Contrato Fechado</h2>
            <div id="col-fechado" class="space-y-4 min-h-[300px]" ondragover="permitirSoltar(event)" ondrop="soltar(event, 'fechado')"></div>
        </div>
    </main>

    <!-- Modal de Cadastro -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Cadastrar Novo Lead</h3>
            <div class="space-y-3">
                <input type="text" id="nome" placeholder="Nome do Cliente" class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-indigo-500">
                <input type="text" id="valor" placeholder="Valor Estimado (R$)" class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-indigo-500">
                <textarea id="notas" placeholder="Anotações" class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-indigo-500"></textarea>
            </div>
            <div class="mt-5 flex justify-end space-x-2">
                <button onclick="fecharModal()" class="px-4 py-2 bg-gray-600 rounded-lg hover:bg-gray-500">Cancelar</button>
                <button onclick="salvarLead()" class="px-4 py-2 bg-indigo-600 rounded-lg hover:bg-indigo-500">Salvar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
